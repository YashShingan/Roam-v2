name: Nightly harvest
on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch: {}

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Harvest (uncapped scrape — runs on the runner, never inside Vercel)
        run: |
          npm run build
          npm run start &
          sleep 8
          node scripts/harvest.mjs http://localhost:3000
        env:
          COLLECT_TOKEN: ${{ secrets.COLLECT_TOKEN }}
      - name: Hygiene sweep
        run: npm run clean
      - name: Seed Turso (shared cloud DB — Vercel serves it immediately)
        run: node scripts/seed.mjs
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
      # data/ is gitignored on purpose — cloud rows live in Turso, not in git.
